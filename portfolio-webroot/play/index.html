<body><main class="shell">

<script>

}
function buildAt(px,py){if(!['build','intermission'].includes(phase)||!selected)return;let id=Object.keys(pads).find(k=>pads[k][0]===px&&pads[k][1]===py);if(!id)return;if(towers.some(t=>t.pad===id)){log('这个位置已经有设施。');return}let cost=goldBy[selected];if(gold<cost){$('#hint').textContent=`金币不足：${names[selected]}需要${cost}金，目前只有${gold}金。`;return}gold-=cost;towers.push({kind:selected,pad:id,x:px,dy:py,ready:0});log(`建造${names[selected]}，剩余${gold}金。`);if(tutorialActive&&tutorialStage===1){setTutorialStage(2);$('#hint').textContent=`③ 左上是金币、关口生命和波次。漏怪会扣关口生命，你也可以用剩余金币继续布防；准备好后再开战。`}else if(tutorialActive&&tutorialStage===2){$('#hint').textContent=`已建造${names[selected]}，剩余${gold}金。漏怪会扣关口生命；你可以继续布防，准备好后开始第一波。`}else{$('#hint').textContent=`已建造${names[selected]}。可用剩余金币继续布防；漏怪会扣关口生命。`}ui()}
function startWave(){if(!['build','intermission'].includes(phase))return;if(waveIndex>=4)return;if(waveIndex===0&&towers.length===0){$('#hint').textContent='先建造至少一座防御设施，再开始第一波。';return}const tutorialWasActive=tutorialActive;tutorialActive=false;setTutorialStage(-1);waveIndex++;phase='battle';clock=0;spawnIndex=0;live=[];shots=[];effects=[];for(const t of towers)t.ready=0;log(`第${waveIndex}波开始：${waves[waveIndex-1].name}。`);const hints=['敌人会自动沿路线前进；弩箭、滚石和雾团命中后才造成伤害。可点击“暂停”观察。','疾行兵移动更快；留意箭和石块是否追上目标。','群集虫密集出现；观察滚石炮的范围命中效果。','盾卫有25%护甲且漏怪扣2点；留意不同攻击弹道的处理情况。'];$('#hint').textContent=hints[waveIndex-1]+(tutorialWasActive?' 新手引导完成：战斗可暂停，清波后可再建塔。':'');ui()}

 for(const t of towers){if(clock+1e-8<t.ready)continue;const spec=towerspec[t.kind],targets=live.filter(e=>distance(e,t)<=spec.range+1e-8);if(!targets.length)continue;let target;if(t.kind==='mortar'){target=targets.map(c=>({c,count:live.filter(e=>Math.abs(e.x-c.x)<=1+1e-8).length})).sort((a,b)=>b.count-a.count||a.c.x-b.c.x)[0].c}else target=targets.reduce((a,b)=>a.x<b.x?a:b);t.ready=clock+spec.interval;const [sx,sy]=cellXY(t.x,t.dy),flight=distance(target,t)/shotSpeed[t.kind];shots.push({kind:t.kind,target,sx,sy,launchedAt:clock,flight,impactAt:clock+flight,damage:spec.damage,slowTime:spec.slowTime||0})}
 const remaining=[];for(const s of shots){if(clock+1e-8<s.impactAt){remaining.push(s);continue}if(!live.includes(s.target)||s.target.hp<=0)continue;let hits=s.kind==='mortar'?live.filter(e=>Math.abs(e.x-s.target.x)<=1+1e-8):[s.target];for(const e of hits){e.hp-=s.damage*(1-e.armor);if(s.kind==='bell'&&e.hp>0)e.slowUntil=Math.max(e.slowUntil,clock+s.slowTime)}effects.push({kind:s.kind,x:s.target.x,at:clock})}shots=remaining;
 const before=live.length;live=live.filter(e=>{if(e.hp<=0){kills++;return false}return true});if(live.length<before)log(`本波累计击退 ${kills} 名敌军。`);effects=effects.filter(fx=>clock-fx.at<.24);
 if(spawnIndex>=wave.spawns.length&&live.length===0&&shots.length===0){if(waveIndex<4){gold+=50;phase='intermission';clock=0;effects=[];log(`第${waveIndex}波清除，获得50金。布防完成后，点击“开始第${waveIndex+1}波”继续。`);$('#hint').textContent=`第${waveIndex}波完成，获得50金。现在可以从容布防；准备好后点击“开始第${waveIndex+1}波”，不会自动开战。`}else{phase='won';log('四波全部结束，关口守住。');$('#hint').textContent='本关完成。你可以重开并尝试不同的塔位与组合。'}ui()}
}
function frame(ts){if(!lastTime)lastTime=ts;let elapsed=Math.min(.12,(ts-lastTime)/1000);lastTime=ts;if(!paused){acc+=elapsed;while(acc>=.05){step(.05);acc-=.05}}draw();ui();requestAnimationFrame(frame)}
canvas.addEventListener('click',ev=>{const rect=canvas.getBoundingClientRect(),x=(ev.clientX-rect.left)*canvas.width/rect.width,y=(ev.clientY-rect.top)*canvas.height/rect.height;for(const [id,[px,py]] of Object.entries(pads)){let [cx,cy]=cellXY(px,py);if(Math.hypot(cx-x,cy-y)<22){buildAt(px,py);return}}});
document.querySelectorAll('.tower').forEach(b=>b.addEventListener('click',()=>{if(!['build','intermission'].includes(phase)){return}selected=b.dataset.kind;if(tutorialActive&&tutorialStage===0){setTutorialStage(1);$('#hint').textContent=`② 已选${names[selected]}（${goldBy[selected]}金）。点地图上闪动的空位置，就把它建在地面上。`}else if(tutorialActive&&tutorialStage===1){$('#hint').textContent=`已改选${names[selected]}。点地图上闪动的空位置完成建造。`}else{$('#hint').textContent=`已选择${names[selected]}（${goldBy[selected]}金）。点击地图空地建造。`}ui()}));
$('#start').addEventListener('click',startWave);$('#pause').addEventListener('click',()=>{paused=!paused;ui()});$('#reset').addEventListener('click',()=>{reset();$('#dismiss').hidden=false;$('#skipGuide').hidden=false;$('#skipGuide').textContent='跳过引导'});$('#dismiss').addEventListener('click',startTutorial);$('#skipGuide').addEventListener('click',finishTutorial);
reset();$('#dismiss').hidden=false;$('#skipGuide').hidden=false;requestAnimationFrame(frame);
</script></body></html>
